[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-weight-space-cnns"
version = "0.1.0"
description = "Reproducible training of the three Experiment 1 protein CNNs"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==2.5.4",
  "torch==2.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]
